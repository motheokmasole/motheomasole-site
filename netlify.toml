[build]
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/newsletter"
  to = "/newsletter.html"
  status = 200

[[redirects]]
  from = "/podcast"
  to = "/podcast.html"
  status = 200

[[redirects]]
  from = "/community"
  to = "/community.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/newsletter"
  status = 301

[[redirects]]
  from = "/blog.html"
  to = "/newsletter"
  status = 301

[[redirects]]
  from = "/article"
  to = "/newsletter"
  status = 301

[[redirects]]
  from = "/article.html"
  to = "/newsletter"
  status = 301

[[redirects]]
  from = "/freebies"
  to = "/community"
  status = 301

[[redirects]]
  from = "/freebies.html"
  to = "/community"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/about"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/about"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
